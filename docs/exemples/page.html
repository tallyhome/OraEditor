<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OraEditor — exemple PHP / HTML</title>
  <link rel="stylesheet" href="/ora-editor/ora-editor.css">
  <style>
    body { margin: 0; font-family: Georgia, serif; background: #faf7f2; color: #1c1917; }
    .wrap { max-width: 52rem; margin: 2rem auto; padding: 0 1rem 3rem; }
    button[type="submit"] {
      margin-top: 1rem; padding: 0.5rem 1rem; border: 0; border-radius: 8px;
      background: #9a3412; color: #fff; font: inherit; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Article</h1>
    <form id="form" method="post" action="/save.php">
      <div id="editor"></div>
      <textarea name="body_json" id="body_json" hidden></textarea>
      <textarea name="body_html" id="body_html" hidden></textarea>
      <button type="submit">Enregistrer</button>
    </form>
  </div>

  <script src="/ora-editor/ora-editor.js"></script>
  <script>
    const editor = new OraEditor({
      element: "#editor",
      toolbar: true,
      preset: "full",
      content: "",
      uploadImage: async function (file) {
        const body = new FormData();
        body.append("file", file);
        const res = await fetch("/ora-editor/upload.php", { method: "POST", body, credentials: "same-origin" });
        if (!res.ok) throw new Error("Upload échoué");
        return res.json();
      },
      aiProxyUrl: "/ora-editor/ai-proxy.php",
    });

    document.getElementById("form").addEventListener("submit", function () {
      document.getElementById("body_json").value = JSON.stringify(editor.getJSON());
      document.getElementById("body_html").value = editor.getHTML();
    });
  </script>
</body>
</html>
